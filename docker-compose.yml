version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/barbershop
      - JWT_SECRET=production_super_secret_jwt_key_vintage_blade_2026
      - CLIENT_ORIGIN=http://localhost:5000
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
