name: CI Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  quality-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Client Codebase
        run: npm --workspace=client run lint

      - name: Run Client Vitest Test Suite
        run: npm --workspace=client run test

      - name: Run Server Test Suite
        run: npm --workspace=server run test

      - name: Build Client Production Bundle
        run: npm --workspace=client run build
